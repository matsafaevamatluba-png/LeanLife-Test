
name: Build LeanLife APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          mkdir unpacked
          unzip -q LeanLife_Android_Project_With_Build_Workflow.zip -d unpacked

      - name: Build APK
        working-directory: unpacked/LeanLife
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeanLife-debug-apk
          path: unpacked/LeanLife/app/build/outputs/apk/debug/app-debug.apk
